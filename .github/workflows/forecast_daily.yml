# Daily next-day fire spread forecast (forecast/spread_model.py), then redeploy the site.
name: Daily fire forecast

on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC: Malaysia's previous day and Argentina's same day are both complete
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scipy scikit-learn joblib
      - name: Download NASA FIRMS NOAA-20 VIIRS, last 7 days (no key needed)
        run: curl -sf -o /tmp/J1_7d.csv https://firms.modaps.eosdis.nasa.gov/data/active_fire/noaa-20-viirs-c2/csv/J1_VIIRS_C2_Global_7d.csv
      - name: Forecast
        run: |
          out=frontend/public/data/forecast
          for c in Malaysia Argentina; do
            rm -f forecast/output/"$c"/spread/forecast_*.csv
            python forecast/spread_model.py --country "$c" --forecast /tmp/J1_7d.csv
            cp forecast/output/"$c"/spread/forecast_*.csv "$out/latest_$c.csv"
          done
          date -u +"%Y-%m-%dT%H:%MZ" > "$out/updated.txt"
      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/public/data/forecast
          git diff --cached --quiet && exit 0
          git commit -m "daily fire forecast" && git push
          gh workflow run pages.yml --ref main
